<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Account</title>

    <style>
        body{
            background: #060917;
        }
    </style>

</head>
<body class="account">

    <nav>
        <div class="nav-left-side">
            <img src="logo2.svg" alt="MSM Logo">
        </div>

        <div class="nav-right-side">
            <button class="logout-btn">Logout</button>
            
            <button class="mode-btn">
                <img src="Frame.svg" alt="mode icon">
            </button>
        </div>
    </nav>

    <main>
        <div class="balance-container">
            <h1>Balance</h1>
            <p><span class="currency">E£</span><span class="money">15009</span></p>
        </div>

        <div class="action-btns">
            <button class="add-money-btn">Add Money</button>
            <button class="add-item-btn">Add Item</button>
            <button class="transactions-btn">Deduct</button>
            <button class="savings-btn">Savings</button>
        </div>

        <div class="purchase-items">
            <ul>
                <li>
                    <span class="item-name">Item 1</span> 
                    <span class="item-price">E£24450</span> 
                    <span class="item-note">Note: Required for blabla</span> 
                </li>
                <li>
                    <span class="item-name">Item 2</span> 
                    <span class="item-price">E£4450</span> 
                    <span class="item-note">Note: tax write off</span> 
                </li>
                <li>
                    <span class="item-name">Item 3</span> 
                    <span class="item-price">E£650</span> 
                    <span class="item-note">Note: Talabat</span> 
                </li>
            </ul>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script>
        const currentEmail = sessionStorage.getItem("currentEmail");
        
        for (let i = 0; i < testAccounts.length; i++) {
            if (currentEmail === testAccounts[i].email) {
                testAccounts[i].login();
                break;
            }
        }
    </script>

</body>
</html>
