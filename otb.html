<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otb verification</title>

    <style>
        *{
            box-sizing: border-box;
            margin : 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica,
sans-serif;
            background:
linear-gradient(135deg, #087eea, #00a8ff);
            min-height: 100v;
            display:flex;
            justify-content: center;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
            padding: 30px;
        }

        .title {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 115px;
        }

        .user-icon::before{
            content: "";
            position: absolute;
            width: 13px;
            height: 13px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            bottom: 7px;
            left:9px;
        }

        h1 {
            font-size: 42px;
            font-weight: 500;
            line-height: 1.1;
            text-align: left;
        }

        .code-title {
            font-size: 24px;
            margin-bottom: 20px;
        }

        input-container {
            position: relative;
            width: 100%;
            margin-bottom: 250px;
        }

        .code-input {
            width: 100%;
            height: 70px;
            border: none;
            border-radius: 4px;
            padding: 25px 50px 8px 20px;
            font-size: 18px;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
        }

        .input-label {
            position: absolute;
            left: 20px;
            top: 10px;
            font-size: 12px;
            color: #777;
            pointer-events: none;
        }

        .close{
            position: absolute;
        }
    </style>
</head>
<body>
    
</body>
</html>
